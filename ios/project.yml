# XcodeGen spec. Generate the project on macOS with `xcodegen generate` in
# this directory after building ios/Frameworks (see ios/README.md).
name: Bridge
options:
  bundleIdPrefix: org.forfoxsakesantuary
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    # The Rust runtime is built for arm64 simulators only.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    ENABLE_BITCODE: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    # Change these two (and DEVELOPMENT_TEAM) to the signing team's own identifiers.
    BRIDGE_BUNDLE_ID: org.forfoxsakesantuary.foxbridgeinternal
    BRIDGE_APP_GROUP: group.org.forfoxsakesantuary.foxbridgeinternal
packages:
  LeikwanIOSCore:
    path: Core
targets:
  Bridge:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: LeikwanIOSCore
      - target: PacketTunnel
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Bridge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Scan a QR code to import a node
        ITSAppUsesNonExemptEncryption: false
        BridgeAppGroup: $(BRIDGE_APP_GROUP)
    entitlements:
      path: App/Bridge.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - $(BRIDGE_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BRIDGE_BUNDLE_ID)
        PRODUCT_NAME: Bridge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
      - path: Shared
      # Bundled sing-box rule-sets, copied as a folder (RuleSetInstaller reads RuleSets/).
      - path: RuleSets
        type: folder
        buildPhase: resources
    dependencies:
      - package: LeikwanIOSCore
      - framework: Frameworks/Libbox.xcframework
        embed: false
      - framework: Frameworks/LeikwanRuntime.xcframework
        embed: false
      - sdk: libresolv.tbd
      - sdk: NetworkExtension.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: Bridge Tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        BridgeAppGroup: $(BRIDGE_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: PacketTunnel/PacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - $(BRIDGE_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BRIDGE_BUNDLE_ID).tunnel
        PRODUCT_NAME: PacketTunnel
        OTHER_LDFLAGS:
          - -lc++
schemes:
  Bridge:
    build:
      targets:
        Bridge: all
        PacketTunnel: all
