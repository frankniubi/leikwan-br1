name: Local Port simulator screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - "ci/mobile-port-screenshots-*"
    paths:
      - ".github/workflows/mobile-port-screenshots.yml"
      - "ios/**"
      - "leikwan-android/**"

permissions:
  contents: read
  actions: read

jobs:
  ios:
    name: iOS Local Port screenshots
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Download validated runtime frameworks
        uses: actions/download-artifact@v4
        with:
          name: ios-frameworks
          run-id: 44895011032
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ios/Frameworks
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build actual debug app for simulator
        working-directory: ios
        run: |
          set -euo pipefail
          xcodegen generate
          mkdir -p build
          xcodebuild build -project Bridge.xcodeproj -scheme Bridge -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/port-sim \
            CODE_SIGNING_ALLOWED=NO >build/local-port-build.log 2>&1 || { tail -100 build/local-port-build.log; exit 1; }
      - name: Capture Local Port demo in actual app
        working-directory: ios
        run: bash scripts/local-port-screenshots.sh build/port-sim/Build/Products/Debug-iphonesimulator/Bridge.app build/local-port-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-local-port-screenshots
          path: |
            ios/build/local-port-screenshots/
            ios/build/local-port-build.log
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android Local Port screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Build app and screenshot test
        working-directory: leikwan-android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture actual Local Port Compose screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect
          script: bash leikwan-android/scripts/local-port-screenshots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-local-port-screenshots
          path: |
            leikwan-android/app/build/local-port-screenshots/
            leikwan-android/app/build/reports/androidTests/
          if-no-files-found: error
          retention-days: 14
