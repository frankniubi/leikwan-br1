name: Windows client

on:
  workflow_dispatch:
  push:
    branches:
      - codex/macos-client

permissions:
  contents: read

concurrency:
  group: windows-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Windows build and tests
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      # Hash-pinned scripts and manifests must keep their LF bytes on Windows too.
      - name: Keep line endings as committed
        shell: bash
        run: git config --global core.autocrlf false

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
          cache-dependency-path: tools/ultra-client/go.sum

      # Windows runs every desktop test, including the Platform=Windows ones macOS skips.
      - name: Run Core and App tests
        id: dotnet_tests
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $failed = $false
          dotnet test LeikwanBridge.Desktop/tests/LeikwanBridge.Core.Tests/LeikwanBridge.Core.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          dotnet test LeikwanBridge.Desktop/tests/LeikwanBridge.App.Tests/LeikwanBridge.App.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          if ($failed) { exit 1 }

      - name: Run Go tests
        id: go_tests
        continue-on-error: true
        shell: pwsh
        run: |
          Set-Location tools/ultra-client
          go test -mod=readonly ./... -count=1
          exit $LASTEXITCODE

      - name: Run Rust tests
        id: rust_tests
        continue-on-error: true
        shell: pwsh
        run: |
          cargo test --manifest-path wstunnel-main/Cargo.toml --locked -p leikwan-bond -p leikwan-ingress -p leikwan-uot
          exit $LASTEXITCODE

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run client agent and release tooling tests
        id: python_tests
        continue-on-error: true
        shell: pwsh
        run: |
          python -m pip install --quiet pytest cryptography
          python -m pytest client-agent/tests tests -q -p no:cacheprovider
          exit $LASTEXITCODE

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ":mbstring, pdo_sqlite, sqlite3, curl, openssl, sodium"
          coverage: none

      - name: Run panel PHP tests
        id: php_tests
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          passed=0; skipped=0; failed_list=()
          for test in master/tests/*.php; do
            reason=$(awk -v n="$(basename "$test")" '$1 == n { print $2 }' .github/ci/php-skip.txt)
            if [ -n "$reason" ]; then
              echo "SKIPPED: $test ($reason)"; skipped=$((skipped + 1)); continue
            fi
            if timeout 120 php -d display_errors=1 "$test" >"$RUNNER_TEMP/php-test.log" 2>&1; then
              passed=$((passed + 1))
            else
              failed_list+=("$test")
              echo "::group::FAILED $test"; tail -20 "$RUNNER_TEMP/php-test.log"; echo "::endgroup::"
            fi
          done
          echo "passed=$passed skipped=$skipped failed=${#failed_list[@]}"
          printf '%s\n' "${failed_list[@]}" | sed 's/^/FAILED: /'
          [ "${#failed_list[@]}" -eq 0 ]

      - name: Build Windows Ultra runtime
        id: runtime
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./scripts/build-ultra-windows.ps1 -Version 2026.10.26.1 -ShortSha $env:GITHUB_SHA.Substring(0, 8) -SkipDefenderScan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish desktop app and headless client
        id: publish
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet publish LeikwanBridge.Desktop/src/LeikwanBridge.App/LeikwanBridge.App.csproj -c Release -r win-x64 --self-contained true -o out/win-publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish LeikwanBridge.Desktop/src/LeikwanBridge.Headless/LeikwanBridge.Headless.csproj -c Release -r win-x64 --self-contained true -o out/headless-publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Item out/win-publish/LeikwanBridge.App.exe).VersionInfo.FileVersion
          "app version $version, $((Get-ChildItem out/win-publish).Count) files; headless $((Get-ChildItem out/headless-publish -Recurse -File).Count) files"

      # An unknown argument makes the windowless client print its usage and exit 2:
      # proof the published single-folder build starts and its runtime loads.
      - name: Smoke-test the headless client
        id: headless_smoke
        if: ${{ steps.publish.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $output = & out/headless-publish/leikwan-bridge-headless.exe --ci-smoke-unknown-flag 2>&1 | Out-String
          $code = $LASTEXITCODE
          $output
          if ($code -ne 2 -or $output -notmatch "headless_invalid_arguments") { throw "headless smoke failed (exit $code)" }
          exit 0

      - name: Parse every PowerShell script
        id: powershell_parse
        continue-on-error: true
        shell: pwsh
        run: |
          $bad = 0
          foreach ($file in Get-ChildItem install, scripts -Recurse -Filter *.ps1) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $bad++; "PARSE ERROR $($file.FullName): $($errors[0].Message)" }
          }
          "parsed PowerShell scripts, $bad with errors"
          if ($bad -gt 0) { exit 1 }

      - name: Upload Windows build outputs
        if: ${{ steps.publish.outcome == 'success' && steps.runtime.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-client
          path: |
            artifacts/ultra/ultra-client_windows_amd64.exe
            out/win-publish
            out/headless-publish
          if-no-files-found: error
          retention-days: 14

      - name: Gate summary
        if: ${{ always() }}
        shell: bash
        env:
          OUTCOMES: >-
            dotnet_tests=${{ steps.dotnet_tests.outcome }}
            go_tests=${{ steps.go_tests.outcome }}
            rust_tests=${{ steps.rust_tests.outcome }}
            python_tests=${{ steps.python_tests.outcome }}
            php_tests=${{ steps.php_tests.outcome }}
            runtime=${{ steps.runtime.outcome }}
            publish=${{ steps.publish.outcome }}
            headless_smoke=${{ steps.headless_smoke.outcome }}
            powershell_parse=${{ steps.powershell_parse.outcome }}
        run: |
          set -euo pipefail
          failed=0
          printf '### Windows gates\n\n| gate | outcome |\n|---|---|\n' >>"$GITHUB_STEP_SUMMARY"
          for pair in $OUTCOMES; do
            printf '| %s | %s |\n' "${pair%%=*}" "${pair#*=}" >>"$GITHUB_STEP_SUMMARY"
            echo "$pair"
            [ "${pair#*=}" = "success" ] || failed=1
          done
          exit "$failed"
