name: Android client

on:
  workflow_dispatch:
  push:
    branches:
      - codex/macos-client

permissions:
  contents: read

concurrency:
  group: android-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Android build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
          cache-dependency-path: tools/ultra-client/go.sum

      # The APK bundles the runtime committed under app/src/main; this proves the
      # current source still builds for both Android ABIs.
      - name: Build Android Ultra runtime (arm64, x86_64)
        id: runtime
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          go install mvdan.cc/garble@v0.17.0
          version="2026.10.26.1.${GITHUB_SHA:0:8}"
          mkdir -p out
          cd tools/ultra-client
          # android/amd64 cannot link internally, so x86_64 uses cgo with the NDK clang,
          # as scripts/build-ultra-android.ps1 does for releases.
          ndk_bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for pair in arm64:arm64:0 amd64:x86_64:1; do
            goarch="${pair%%:*}"; rest="${pair#*:}"; abi="${rest%%:*}"; cgo="${rest#*:}"
            cc=""
            if [ "$cgo" = "1" ]; then cc="$ndk_bin/x86_64-linux-android21-clang"; fi
            GOOS=android GOARCH="$goarch" CGO_ENABLED="$cgo" CC="$cc" "$(go env GOPATH)/bin/garble" -literals build \
              -buildmode=pie -trimpath -buildvcs=false \
              -ldflags "-s -w -buildid= -X main.runtimeBuildVersion=$version" \
              -o "../../out/ultra-client_android_$abi" .
            sha256sum "../../out/ultra-client_android_$abi"
          done

      - name: Run Android unit tests
        id: unit_tests
        continue-on-error: true
        shell: bash
        working-directory: leikwan-android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        id: apk
        continue-on-error: true
        shell: bash
        working-directory: leikwan-android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
          ls -la app/build/outputs/apk/debug/

      - name: Upload Android outputs
        if: ${{ steps.apk.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-client
          path: |
            leikwan-android/app/build/outputs/apk/debug/*.apk
            out/ultra-client_android_*
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: leikwan-android/app/build/reports/tests
          if-no-files-found: ignore
          retention-days: 14

      - name: Gate summary
        if: ${{ always() }}
        shell: bash
        env:
          OUTCOMES: >-
            runtime=${{ steps.runtime.outcome }}
            unit_tests=${{ steps.unit_tests.outcome }}
            apk=${{ steps.apk.outcome }}
        run: |
          set -euo pipefail
          failed=0
          printf '### Android gates\n\n| gate | outcome |\n|---|---|\n' >>"$GITHUB_STEP_SUMMARY"
          for pair in $OUTCOMES; do
            printf '| %s | %s |\n' "${pair%%=*}" "${pair#*=}" >>"$GITHUB_STEP_SUMMARY"
            echo "$pair"
            [ "${pair#*=}" = "success" ] || failed=1
          done
          exit "$failed"
