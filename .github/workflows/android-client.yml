name: Android client

on:
  workflow_dispatch:
  push:
    branches:
      - codex/macos-client

permissions:
  contents: read

concurrency:
  group: android-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Android build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
          cache-dependency-path: tools/ultra-client/go.sum

      # Build and package the exact runtime being tested, not the previous release ELF.
      - name: Build Android Ultra runtime (arm64, x86_64)
        id: runtime
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          go install mvdan.cc/garble@v0.17.0
          version="$(python3 scripts/runtime-build-identity.py --field fingerprint)"
          mkdir -p out
          cd tools/ultra-client
          # android/amd64 cannot link internally, so x86_64 uses cgo with the NDK clang,
          # as scripts/build-ultra-android.ps1 does for releases.
          ndk_bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for pair in arm64:arm64:0 amd64:x86_64:1; do
            goarch="${pair%%:*}"; rest="${pair#*:}"; abi="${rest%%:*}"; cgo="${rest#*:}"
            cc=""
            if [ "$cgo" = "1" ]; then cc="$ndk_bin/x86_64-linux-android21-clang"; fi
            GOOS=android GOARCH="$goarch" CGO_ENABLED="$cgo" CC="$cc" "$(go env GOPATH)/bin/garble" -literals build \
              -buildmode=pie -trimpath -buildvcs=false \
              -ldflags "-s -w -buildid= -X main.runtimeBuildVersion=$version" \
              -o "../../out/ultra-client_android_$abi" .
            sha256sum "../../out/ultra-client_android_$abi"
          done

      - name: Package rebuilt Ultra runtime slices
        if: ${{ steps.runtime.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          for pair in arm64:arm64-v8a x86_64:x86_64; do
            source="out/ultra-client_android_${pair%%:*}"
            abi="${pair#*:}"
            mkdir -p "leikwan-android/app/src/main/jniLibs/$abi" "leikwan-android/app/src/main/assets/runtime/$abi"
            cp "$source" "leikwan-android/app/src/main/jniLibs/$abi/libultra_client.so"
            cp "$source" "leikwan-android/app/src/main/assets/runtime/$abi/ultra-client"
          done

      - name: Run Android unit tests
        id: unit_tests
        continue-on-error: true
        shell: bash
        working-directory: leikwan-android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        id: apk
        continue-on-error: true
        shell: bash
        working-directory: leikwan-android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
          ls -la app/build/outputs/apk/debug/

      - name: Build release APK with R8
        id: release_apk
        continue-on-error: true
        shell: bash
        working-directory: leikwan-android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Verify APK contains the rebuilt Ultra runtime
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import zipfile
          for variant, name in [('debug', 'app-debug.apk'), ('release', 'app-release-unsigned.apk')]:
              path = Path('leikwan-android/app/build/outputs/apk') / variant / name
              with zipfile.ZipFile(path) as apk:
                  for source, abi in [('arm64', 'arm64-v8a'), ('x86_64', 'x86_64')]:
                      expected = Path('out/ultra-client_android_' + source).read_bytes()
                      assert apk.read('lib/' + abi + '/libultra_client.so') == expected, (variant, abi)
                      assert apk.read('assets/runtime/' + abi + '/ultra-client') == expected, (variant, abi, 'asset')
              print(path, 'both ABI runtime slices match this source build')
          PYTHON

      - name: Upload release APK and mapping
        if: ${{ steps.release_apk.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-release-unsigned
          path: |
            leikwan-android/app/build/outputs/apk/release/*.apk
            leikwan-android/app/build/outputs/mapping/release/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android outputs
        if: ${{ steps.apk.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-client
          path: |
            leikwan-android/app/build/outputs/apk/debug/*.apk
            out/ultra-client_android_*
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: leikwan-android/app/build/reports/tests
          if-no-files-found: ignore
          retention-days: 14

      - name: Enable KVM for port-mode runtime instrumentation
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test actual port-mode FD binding on Android
        id: port_egress
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect
          script: cd leikwan-android && ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest -Pqatest=true -Pandroid.testInstrumentationRunnerArguments.class=com.leikwan.bridge.net.DirectPortEgressRuntimeTest

      - name: Upload port-mode instrumentation reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-port-egress-reports
          path: |
            leikwan-android/app/build/reports/androidTests/
            leikwan-android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Gate summary
        if: ${{ always() }}
        shell: bash
        env:
          OUTCOMES: >-
            runtime=${{ steps.runtime.outcome }}
            unit_tests=${{ steps.unit_tests.outcome }}
            apk=${{ steps.apk.outcome }}
            release_apk=${{ steps.release_apk.outcome }}
            port_egress=${{ steps.port_egress.outcome }}
        run: |
          set -euo pipefail
          failed=0
          printf '### Android gates\n\n| gate | outcome |\n|---|---|\n' >>"$GITHUB_STEP_SUMMARY"
          for pair in $OUTCOMES; do
            printf '| %s | %s |\n' "${pair%%=*}" "${pair#*=}" >>"$GITHUB_STEP_SUMMARY"
            echo "$pair"
            [ "${pair#*=}" = "success" ] || failed=1
          done
          exit "$failed"
