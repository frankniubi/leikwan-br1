<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeiKwan Bridge</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Login View -->
        <div id="login-view" class="view active">
            <div class="login-card">
                <div class="login-logo">
                    <img src="logo.png" alt="LeiKwan Bridge" class="logo-img">
                </div>
                <div class="login-subtitle">Connect to your network</div>
                <form id="login-form">
                    <div class="field">
                        <label for="panel-url">Panel URL</label>
                        <input type="url" id="panel-url" placeholder="https://v3.leikwanhost.com" value="https://v3.leikwanhost.com" required>
                    </div>
                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="your@email.com" required>
                    </div>
                    <div class="field">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Password" required>
                    </div>
                    <button type="submit" id="login-btn">
                        <span class="btn-text">Sign In</span>
                        <span class="btn-loading" style="display:none;">Signing in...</span>
                    </button>
                    <p id="login-error" class="error-msg"></p>
                </form>
            </div>
        </div>

        <!-- Main View -->
        <div id="main-view" class="view">
            <nav class="topbar">
                <div class="topbar-left">
                    <img src="logo.png" alt="" class="topbar-logo">
                    <span class="topbar-title">LeiKwan Bridge</span>
                </div>
                <div class="topbar-right">
                    <span id="username" class="topbar-user"></span>
                    <button id="refresh-btn" class="btn btn-ghost" title="Refresh forwards">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M13.65 2.35A8 8 0 1 0 16 8h-2a6 6 0 1 1-1.76-4.24L10 6h6V0l-2.35 2.35z" fill="currentColor"/></svg>
                    </button>
                    <button id="logout-btn" class="btn btn-ghost" title="Logout">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6M2 8h8M7 5l3 3-3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
                    </button>
                </div>
            </nav>

            <!-- System status banner -->
            <div id="system-status" class="system-banner" style="display:none;"></div>

            <!-- Loading state -->
            <div id="loading-state" class="state-msg">
                <div class="spinner"></div>
                <span>Loading forwards...</span>
            </div>

            <!-- Forward list -->
            <div id="forward-list" class="forward-list"></div>

            <!-- Empty state -->
            <div id="empty-state" class="state-msg" style="display:none;">
                <svg width="48" height="48" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="20" stroke="currentColor" stroke-width="2" opacity="0.3"/><path d="M16 24h16M24 16v16" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.3"/></svg>
                <p>No forwards assigned to this client.</p>
                <p class="muted">Ask your administrator to assign forwards in the panel.</p>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
